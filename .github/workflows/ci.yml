name: CI

on:
  push:
    branches:
      - main
  # A stacked layer joins its stack after it opens, and joining fires no
  # workflow trigger, so the run from its own `opened` event is the only one it
  # is guaranteed. Leave `pull_request` unfiltered by base so that run happens.
  pull_request:
  # The escape hatch for a stacked pull request whose checks never fired.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
