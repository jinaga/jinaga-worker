name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # The escape hatch for a stacked pull request whose checks never fired.
  # There is no `branches:` filter above, so every layer gets a run from its
  # own pull request event and this should stay unused.
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
